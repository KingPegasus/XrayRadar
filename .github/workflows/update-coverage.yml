name: Update Coverage Badges

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-badges:
    runs-on: ubuntu-latest
    # Only run if CI succeeded, or if it's a manual dispatch
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - name: Get PR branch info
        id: pr-info
        if: github.event_name == 'workflow_run'
        uses: actions/github-script@v7
        with:
          script: |
            const workflowRun = context.payload.workflow_run;
            const prNumber = workflowRun.pull_requests?.[0]?.number;
            
            if (prNumber) {
              const pr = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });
              core.setOutput('branch', pr.data.head.ref);
              core.setOutput('is_pr', 'true');
            } else {
              core.setOutput('branch', workflowRun.head_branch || 'main');
              core.setOutput('is_pr', 'false');
            }

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # For PRs, checkout the PR branch; for workflow_run, use the branch from pr-info or head_branch
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || (github.event_name == 'workflow_run' && steps.pr-info.outputs.branch) || (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch) || 'main' }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: xrayradar-web/package-lock.json

      - name: Install backend dependencies
        run: uv sync --extra dev

      - name: Install frontend dependencies
        working-directory: xrayradar-web
        run: npm ci

      - name: Get backend coverage
        id: backend-cov
        run: |
          COV=$(uv run pytest --cov=src/xrayradar_server --cov-report=term --quiet 2>&1 | grep -E "^TOTAL" | awk '{print $NF}' | sed 's/%//' || echo "0")
          echo "coverage=$COV" >> $GITHUB_OUTPUT
          echo "Backend coverage: $COV%"

      - name: Get frontend coverage
        id: frontend-cov
        working-directory: xrayradar-web
        run: |
          # Vitest table: "All files | XX.XX | ..." - use pipe as delimiter, take first % column (Stmts)
          COV=$(npm run test:coverage -- --run 2>&1 | grep -E "All files" | awk -F'|' '{gsub(/^[ \t]+|[ \t]+$/,"",$2); print $2}' | head -1)
          COV=${COV:-0}
          echo "coverage=$COV" >> $GITHUB_OUTPUT
          echo "Frontend coverage: $COV%"

      - name: Determine badge colors
        id: colors
        run: |
          BACKEND_COV=${{ steps.backend-cov.outputs.coverage }}
          FRONTEND_COV=${{ steps.frontend-cov.outputs.coverage }}
          
          if (( $(echo "$BACKEND_COV >= 90" | bc -l) )); then
            BACKEND_COLOR="brightgreen"
          elif (( $(echo "$BACKEND_COV >= 75" | bc -l) )); then
            BACKEND_COLOR="green"
          elif (( $(echo "$BACKEND_COV >= 50" | bc -l) )); then
            BACKEND_COLOR="yellow"
          else
            BACKEND_COLOR="red"
          fi
          
          if (( $(echo "$FRONTEND_COV >= 90" | bc -l) )); then
            FRONTEND_COLOR="brightgreen"
          elif (( $(echo "$FRONTEND_COV >= 75" | bc -l) )); then
            FRONTEND_COLOR="green"
          elif (( $(echo "$FRONTEND_COV >= 50" | bc -l) )); then
            FRONTEND_COLOR="yellow"
          else
            FRONTEND_COLOR="red"
          fi
          
          echo "backend_color=$BACKEND_COLOR" >> $GITHUB_OUTPUT
          echo "frontend_color=$FRONTEND_COLOR" >> $GITHUB_OUTPUT

      - name: Update README with coverage badges
        run: |
          # Use Python to update README more reliably
          BACKEND_COV=${{ steps.backend-cov.outputs.coverage }} \
          FRONTEND_COV=${{ steps.frontend-cov.outputs.coverage }} \
          BACKEND_COLOR=${{ steps.colors.outputs.backend_color }} \
          FRONTEND_COLOR=${{ steps.colors.outputs.frontend_color }} \
          python3 << 'EOF'
          import os
          import re
          
          BACKEND_COV = os.environ['BACKEND_COV']
          FRONTEND_COV = os.environ['FRONTEND_COV']
          BACKEND_COLOR = os.environ['BACKEND_COLOR']
          FRONTEND_COLOR = os.environ['FRONTEND_COLOR']
          
          with open('README.md', 'r') as f:
              content = f.read()
          
          # Update backend badge
          content = re.sub(
              r'!\[Backend Coverage\]\(https://img\.shields\.io/badge/backend%20coverage-[0-9.]+%25-[a-z]+\?style=flat-square\)',
              f'![Backend Coverage](https://img.shields.io/badge/backend%20coverage-{BACKEND_COV}%25-{BACKEND_COLOR}?style=flat-square)',
              content
          )
          
          # Update frontend badge
          content = re.sub(
              r'!\[Frontend Coverage\]\(https://img\.shields\.io/badge/frontend%20coverage-[0-9.]+%25-[a-z]+\?style=flat-square\)',
              f'![Frontend Coverage](https://img.shields.io/badge/frontend%20coverage-{FRONTEND_COV}%25-{FRONTEND_COLOR}?style=flat-square)',
              content
          )
          
          # Update coverage text
          content = re.sub(
              r'- \*\*Backend \(Python\)\*\*: [0-9.]+%',
              f'- **Backend (Python)**: {BACKEND_COV}%',
              content
          )
          
          content = re.sub(
              r'- \*\*Frontend \(React\)\*\*: [0-9.]+%',
              f'- **Frontend (React)**: {FRONTEND_COV}%',
              content
          )
          
          with open('README.md', 'w') as f:
              f.write(content)
          EOF

      - name: Determine branch and PR status
        id: branch-info
        run: |
          if [ "${{ github.event_name }}" == "workflow_run" ]; then
            # Use pr-info output if available (for PRs), otherwise fall back to workflow_run head_branch
            BRANCH="${{ steps.pr-info.outputs.branch }}"
            if [ -z "$BRANCH" ]; then
              BRANCH="${{ github.event.workflow_run.head_branch }}"
            fi
            echo "branch=${BRANCH:-main}" >> $GITHUB_OUTPUT
            IS_PR="${{ steps.pr-info.outputs.is_pr }}"
            echo "is_pr=${IS_PR:-false}" >> $GITHUB_OUTPUT
          else
            # For workflow_dispatch, use the actual branch (refs/heads/branch -> branch)
            BRANCH="${{ github.ref_name }}"
            echo "branch=${BRANCH:-main}" >> $GITHUB_OUTPUT
            echo "is_pr=false" >> $GITHUB_OUTPUT
          fi

      - name: Skip if main branch
        id: skip-main
        run: |
          BRANCH="${{ steps.branch-info.outputs.branch }}"
          if [ "$BRANCH" == "main" ] || [ "$BRANCH" == "master" ]; then
            echo "Skipping README update on main branch"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push if changed
        if: steps.skip-main.outputs.skip != 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Check if README changed
          if git diff --exit-code README.md; then
            echo "No changes to README.md"
            exit 0
          fi
          
          git add README.md
          git commit -m "chore: update test coverage badges [skip ci]"
          
          # Push to the PR branch
          BRANCH="${{ steps.branch-info.outputs.branch }}"
          echo "Pushing to PR branch: $BRANCH"
          git push origin HEAD:$BRANCH
