name: Update Coverage Badges

# Run manually to refresh badges (e.g. on main). PRs get badges updated by CI's update-badges job.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-badges:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: xrayradar-web/package-lock.json

      - name: Install backend dependencies
        run: uv sync --extra dev

      - name: Install frontend dependencies
        working-directory: xrayradar-web
        run: npm ci

      - name: Get backend coverage
        id: backend-cov
        run: |
          COV=$(uv run pytest --cov=src/xrayradar_server --cov-report=term --quiet 2>&1 | grep -E "^TOTAL" | awk '{print $NF}' | sed 's/%//' || echo "0")
          echo "coverage=$COV" >> $GITHUB_OUTPUT
          echo "Backend coverage: $COV%"

      - name: Get frontend coverage
        id: frontend-cov
        working-directory: xrayradar-web
        run: |
          # Vitest table: "All files | XX.XX | ..." - use pipe as delimiter, take first % column (Stmts)
          COV=$(npm run test:coverage -- --run 2>&1 | grep -E "All files" | awk -F'|' '{gsub(/^[ \t]+|[ \t]+$/,"",$2); print $2}' | head -1)
          COV=${COV:-0}
          echo "coverage=$COV" >> $GITHUB_OUTPUT
          echo "Frontend coverage: $COV%"

      - name: Determine badge colors
        id: colors
        run: |
          BACKEND_COV=${{ steps.backend-cov.outputs.coverage }}
          FRONTEND_COV=${{ steps.frontend-cov.outputs.coverage }}
          
          if (( $(echo "$BACKEND_COV >= 90" | bc -l) )); then
            BACKEND_COLOR="brightgreen"
          elif (( $(echo "$BACKEND_COV >= 75" | bc -l) )); then
            BACKEND_COLOR="green"
          elif (( $(echo "$BACKEND_COV >= 50" | bc -l) )); then
            BACKEND_COLOR="yellow"
          else
            BACKEND_COLOR="red"
          fi
          
          if (( $(echo "$FRONTEND_COV >= 90" | bc -l) )); then
            FRONTEND_COLOR="brightgreen"
          elif (( $(echo "$FRONTEND_COV >= 75" | bc -l) )); then
            FRONTEND_COLOR="green"
          elif (( $(echo "$FRONTEND_COV >= 50" | bc -l) )); then
            FRONTEND_COLOR="yellow"
          else
            FRONTEND_COLOR="red"
          fi
          
          echo "backend_color=$BACKEND_COLOR" >> $GITHUB_OUTPUT
          echo "frontend_color=$FRONTEND_COLOR" >> $GITHUB_OUTPUT

      - name: Update README with coverage badges
        run: |
          # Use Python to update README more reliably
          BACKEND_COV=${{ steps.backend-cov.outputs.coverage }} \
          FRONTEND_COV=${{ steps.frontend-cov.outputs.coverage }} \
          BACKEND_COLOR=${{ steps.colors.outputs.backend_color }} \
          FRONTEND_COLOR=${{ steps.colors.outputs.frontend_color }} \
          python3 << 'EOF'
          import os
          import re
          
          backend_cov = int(round(float(os.environ.get('BACKEND_COV', 0))))
          frontend_cov = int(round(float(os.environ.get('FRONTEND_COV', 0))))
          backend_color = os.environ.get('BACKEND_COLOR', 'red')
          frontend_color = os.environ.get('FRONTEND_COLOR', 'red')
          pct = '%25'  # percent sign in URL
          
          with open('README.md', 'r') as f:
              content = f.read()
          
          content = re.sub(
              r'!\[Backend Coverage\]\(https://img\.shields\.io/badge/backend%20coverage-[0-9.]+%25-[a-z]+\?style=flat-square\)',
              f'![Backend Coverage](https://img.shields.io/badge/backend%20coverage-{backend_cov}{pct}-{backend_color}?style=flat-square)',
              content
          )
          content = re.sub(
              r'!\[Frontend Coverage\]\(https://img\.shields\.io/badge/frontend%20coverage-[0-9.]+%25-[a-z]+\?style=flat-square\)',
              f'![Frontend Coverage](https://img.shields.io/badge/frontend%20coverage-{frontend_cov}{pct}-{frontend_color}?style=flat-square)',
              content
          )
          
          with open('README.md', 'w') as f:
              f.write(content)
          EOF

      - name: Skip if main branch
        id: skip-main
        run: |
          BRANCH="${{ github.ref_name }}"
          if [ "$BRANCH" == "main" ] || [ "$BRANCH" == "master" ]; then
            echo "Skipping README update on main (use a branch to update badges via this workflow)"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push if changed
        if: steps.skip-main.outputs.skip != 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Check if README changed
          if git diff --exit-code README.md; then
            echo "No changes to README.md"
            exit 0
          fi
          
          git add README.md
          git commit -m "chore: update test coverage badges [skip ci]"
          
          BRANCH="${{ github.ref_name }}"
          echo "Pushing to branch: $BRANCH"
          git push origin HEAD:$BRANCH
