name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (py3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          # Disable cache to avoid job failure when GitHub cache service is unavailable (post cleanup)
          enable-cache: false

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests with coverage
        run: |
          uv run pytest -q \
            --cov=src/xrayradar_server \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py3.12
          path: coverage.xml
          if-no-files-found: error

  security:
    name: Security (pip-audit + bandit + npm audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: false

      - name: Install dependencies
        run: |
          uv sync --extra dev
          uv pip install pip-audit bandit

      - name: Dependency audit (pip-audit)
        run: uv run pip-audit

      - name: Static security scan (bandit)
        run: uv run bandit -q -r src

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: xrayradar-web/package-lock.json

      - name: Install frontend dependencies
        working-directory: xrayradar-web
        run: npm ci

      - name: Frontend dependency audit (npm audit)
        working-directory: xrayradar-web
        run: npm audit --audit-level=moderate || true

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: xrayradar-web/package-lock.json

      - name: Install dependencies
        working-directory: xrayradar-web
        run: npm ci

      - name: Run tests with coverage
        working-directory: xrayradar-web
        run: npm run test:coverage -- --run

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: xrayradar-web/coverage/
          if-no-files-found: warn

