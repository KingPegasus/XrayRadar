[build-system]
requires = ["setuptools>=61.0", "wheel>=0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "xrayradar-server"
version = "0.13.0"
description = "Backend server for xrayradar error tracking"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.128.0,<1.0",
  "uvicorn[standard]>=0.40.0,<1.0",
  "sqlalchemy>=2.0.46,<3.0",
  "psycopg2-binary>=2.9.11,<3.0",
  "pydantic>=2.12.5,<3.0",
  "httpx>=0.28.1,<1.0",
  "itsdangerous>=2.2.0,<3.0",
  "alembic>=1.18.3,<2.0",
  "resend>=2.21.0,<3.0",
  "slowapi>=0.1.9,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.2,<9.0",
  "pytest-cov>=6.3.0,<7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"
