[build-system]
requires = ["setuptools>=61.0", "wheel>=0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "xrayradar-server"
version = "0.18.0"
description = "Backend server for xrayradar error tracking"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.136.1,<1.0",
  "uvicorn[standard]>=0.47.0,<1.0",
  "sqlalchemy>=2.0.49,<3.0",
  "psycopg2-binary>=2.9.12,<3.0",
  "pydantic>=2.13.4,<3.0",
  "httpx>=0.28.1,<1.0",
  "itsdangerous>=2.2.0,<3.0",
  "alembic>=1.18.4,<2.0",
  "resend>=2.30.1,<3.0",
  "requests>=2.34.2,<3.0",
  "slowapi>=0.1.9,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10.0",
  "pytest-cov>=7.0.0,<8.0",
  "pip-audit>=2.10.0,<3.0",
  "pygments>=2.20.0,<3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"
