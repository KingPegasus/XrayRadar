[build-system]
requires = ["setuptools>=61.0", "wheel>=0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "xrayradar-server"
version = "0.20.0"
description = "Backend server for xrayradar error tracking"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.141.1,<1.0",
  "uvicorn[standard]>=0.54.0,<1.0",
  "sqlalchemy>=2.0.54,<3.0",
  "psycopg2-binary>=2.9.13,<3.0",
  "pydantic>=2.13.5,<3.0",
  "httpx>=0.28.1,<1.0",
  "itsdangerous>=2.2.0,<3.0",
  "alembic>=1.20.0,<2.0",
  "resend>=2.48.0,<3.0",
  "requests>=2.34.2,<3.0",
  "slowapi>=0.1.10,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1,<10.0",
  "pytest-cov>=7.0.0,<8.0",
  "pip-audit>=2.10.1,<3.0",
  "pygments>=2.21.0,<3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"
