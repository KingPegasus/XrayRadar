[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xrayradar-server"
version = "0.1.0"
description = "Backend server for xrayradar error tracking"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.128.0",
  "uvicorn[standard]>=0.40.0",
  "sqlalchemy>=2.0.45",
  "psycopg2-binary>=2.9.11",
  "pydantic>=2.12.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
